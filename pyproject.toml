[project]
name = "claude-watchdog"
version = "9.9.9"
description = "[DEPRECATED] Replaced by claude-tmux-dog (cdog) — see github.com/SnowAIGirl/claude-tmux-dog"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "LinQuan", email = "i@linquan.name"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
homepage = "https://github.com/SnowAIGirl/claude-tmux-dog"
repository = "https://github.com/SnowAIGirl/claude-tmux-dog"

[project.scripts]
claude-watchdog = "claude_watchdog.cli:main"

[tool.setuptools.packages.find]
include = ["claude_watchdog*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
